<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Dashboard</title>

    <!-- Theme flash-prevention: apply saved theme before first paint -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme') || 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Header: Theme toggle -->
      <header class="dashboard-header">
        <h1 class="dashboard-title">Personal Dashboard</h1>
        <div id="theme-toggle">
          <button id="theme-toggle-btn" aria-label="Toggle light/dark theme">
            🌙 Dark Mode
          </button>
        </div>
      </header>

      <main class="dashboard-main">
        <!-- Greeting Section: time, date, personalized greeting -->
        <section id="greeting-section" class="widget widget--greeting" aria-label="Greeting and clock">
          <p class="greeting-time">--:--:--</p>
          <p class="greeting-date">---</p>
          <p class="greeting-message">---</p>
        </section>

        <!-- Name Settings: user name input -->
        <section id="name-settings" class="widget widget--name-settings" aria-label="Name settings">
          <h2>Your Name</h2>
          <form id="name-form" autocomplete="off">
            <label for="name-input">Display name</label>
            <input
              type="text"
              id="name-input"
              name="name"
              placeholder="Enter your name"
              maxlength="100"
            />
            <button type="submit">Save</button>
          </form>
        </section>

        <!-- Focus Timer: Pomodoro countdown -->
        <section id="focus-timer" class="widget widget--timer" aria-label="Focus timer">
          <h2>Focus Timer</h2>
          <div id="timer-display" class="timer-display" aria-live="polite" aria-label="Timer countdown">
            25:00
          </div>
          <div class="timer-controls">
            <button id="timer-start" type="button">Start</button>
            <button id="timer-stop" type="button" disabled>Stop</button>
            <button id="timer-reset" type="button">Reset</button>
          </div>
          <div id="timer-alert" class="timer-alert" role="alert" aria-live="assertive" hidden></div>
        </section>

        <!-- Duration Settings: Pomodoro duration input -->
        <section id="duration-settings" class="widget widget--duration-settings" aria-label="Duration settings">
          <h2>Timer Duration</h2>
          <form id="duration-form" autocomplete="off">
            <label for="duration-input">Duration (minutes, 1–120)</label>
            <input
              type="number"
              id="duration-input"
              name="duration"
              min="1"
              max="120"
              value="25"
            />
            <button type="submit">Save</button>
          </form>
          <p id="duration-error" class="error-msg" role="alert" hidden></p>
        </section>

        <!-- To-Do List: task manager -->
        <section id="todo-list" class="widget widget--todo" aria-label="To-do list">
          <h2>To-Do List</h2>
          <form id="todo-form" autocomplete="off">
            <label for="todo-input">New task</label>
            <input
              type="text"
              id="todo-input"
              name="task"
              placeholder="Add a task…"
              maxlength="200"
            />
            <button type="submit">Add</button>
          </form>
          <p id="todo-error" class="error-msg" role="alert" hidden></p>
          <p id="todo-warn" class="warn-msg" role="alert" hidden></p>

          <div class="todo-controls">
            <label for="sort-select">Sort by</label>
            <select id="sort-select" name="sort">
              <option value="default">Default (creation order)</option>
              <option value="alpha-asc">Alphabetical A–Z</option>
              <option value="alpha-desc">Alphabetical Z–A</option>
              <option value="completed-last">Completed Last</option>
              <option value="completed-first">Completed First</option>
            </select>
          </div>

          <ul id="task-list" class="task-list" aria-label="Tasks" aria-live="polite"></ul>
        </section>

        <!-- Quick Links: bookmark buttons -->
        <section id="quick-links" class="widget widget--quick-links" aria-label="Quick links">
          <h2>Quick Links</h2>
          <form id="links-form" autocomplete="off">
            <label for="link-label-input">Label</label>
            <input
              type="text"
              id="link-label-input"
              name="label"
              placeholder="e.g. GitHub"
              maxlength="100"
            />
            <label for="link-url-input">URL</label>
            <input
              type="url"
              id="link-url-input"
              name="url"
              placeholder="https://example.com"
              maxlength="2048"
            />
            <button type="submit">Add Link</button>
          </form>
          <p id="links-error" class="error-msg" role="alert" hidden></p>

          <ul id="links-list" class="links-list" aria-label="Saved links" aria-live="polite"></ul>
        </section>
      </main>

      <!-- Storage-unavailable banner (shown by JS when localStorage is inaccessible) -->
      <div id="storage-banner" class="storage-banner" role="alert" aria-live="polite" hidden>
        Local storage unavailable. Changes won't be saved.
      </div>
    </div>

    <script src="js/app.js" defer></script>
  </body>
</html>
