<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Dashboard Tests</title>

    <!-- Jasmine standalone CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/jasmine@5/lib/jasmine-core/jasmine.css"
    />
  </head>
  <body>
    <!-- Jasmine standalone scripts — order matters -->
    <script src="https://cdn.jsdelivr.net/npm/jasmine@5/lib/jasmine-core/jasmine.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jasmine@5/lib/jasmine-core/jasmine-html.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jasmine@5/lib/jasmine-core/boot0.js"></script>

    <!-- fast-check property-based testing library -->
    <script src="https://cdn.jsdelivr.net/npm/fast-check/lib/bundle/fast-check.min.js"></script>

    <!--
      Activate the test bridge BEFORE loading app.js.
      app.js checks for window.__dashboardTest and exposes pure functions
      only when this object is pre-defined.
    -->
    <script>
      window.__dashboardTest = {};
    </script>

    <!-- Main app — pure functions are attached to window.__dashboardTest -->
    <script src="../js/app.js"></script>

    <!-- Jasmine boot1 must come after app scripts but before test specs -->
    <script src="https://cdn.jsdelivr.net/npm/jasmine@5/lib/jasmine-core/boot1.js"></script>

    <!-- Test suite -->
    <script src="tests.js"></script>
  </body>
</html>
